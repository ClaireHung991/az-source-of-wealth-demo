<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SourceWise demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&amp;family=Noto+Serif+SC:wght@400;600&amp;display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F6;--surface:#FFFFFF;--surface-2:#EBF0F2;--ink:#13262C;--ink-2:#46585E;--ink-3:#738489;--line:#D6DFE2;
  --brand:#16323A;--brand-2:#21454F;--accent:#1F7A63;--accent-ink:#FFFFFF;--accent-soft:#E0F1EA;
  --warn:#8E5A0E;--warn-soft:#FBEFD8;--crit:#A8323F;--crit-soft:#FBE6E8;--info:#2A5A8A;--info-soft:#E5EEF8;
  --paper:#FFFFFF;--paper-ink:#1F1F1F;--hl:#FFE38A;
  --s1:#1F7A63;--s2:#2B6A88;--s3:#5E5394;--s4:#7A6A2E;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E181B;--surface:#152327;--surface-2:#1C2E33;--ink:#E4EDEF;--ink-2:#A7B9BE;--ink-3:#7D9196;--line:#2A3D43;
    --brand:#0A1417;--brand-2:#16282D;--accent:#4FC2A0;--accent-ink:#06251C;--accent-soft:#163A30;
    --warn:#E6AE55;--warn-soft:#3A2B12;--crit:#F07F8B;--crit-soft:#3E1C22;--info:#86B6E8;--info-soft:#1A2C3F;
    --paper:#F5F4F0;--paper-ink:#1F1F1F;--hl:#F2CF5B;
    --s1:#2E9C7F;--s2:#3A86AB;--s3:#7C70B8;--s4:#9C8A45;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E181B;--surface:#152327;--surface-2:#1C2E33;--ink:#E4EDEF;--ink-2:#A7B9BE;--ink-3:#7D9196;--line:#2A3D43;
  --brand:#0A1417;--brand-2:#16282D;--accent:#4FC2A0;--accent-ink:#06251C;--accent-soft:#163A30;
  --warn:#E6AE55;--warn-soft:#3A2B12;--crit:#F07F8B;--crit-soft:#3E1C22;--info:#86B6E8;--info-soft:#1A2C3F;
  --paper:#F5F4F0;--paper-ink:#1F1F1F;--hl:#F2CF5B;
  --s1:#2E9C7F;--s2:#3A86AB;--s3:#7C70B8;--s4:#9C8A45;
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 "Instrument Sans","PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px}
h1{font-size:26px;line-height:1.2;letter-spacing:-0.012em;font-weight:600;margin:0 0 4px}
h2{font-size:18px;font-weight:600;margin:0 0 12px;letter-spacing:-0.005em}
h3{font-size:15px;font-weight:600;margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:13px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:#EAF2F3;display:flex;align-items:center;gap:14px;padding:0 20px;height:58px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;letter-spacing:-0.01em}
.logo svg{display:block}
.top .spacer{flex:1}
.credit{font-size:12.5px;color:#A9C1C6;white-space:nowrap}
@media (max-width:760px){.credit{display:none}}
.demo-tag{font-size:12px;font-weight:600;color:#BFD3D7;border:1px solid #3B5A62;border-radius:999px;padding:2px 9px}
.bell{position:relative;background:transparent;border:0;color:#EAF2F3;cursor:pointer;padding:6px;border-radius:6px;display:flex}
.bell:hover{background:var(--brand-2)}
.bell .dot{position:absolute;top:2px;right:2px;min-width:16px;height:16px;border-radius:999px;background:#E2626F;color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.who{position:relative}
.who-btn{display:flex;align-items:center;gap:9px;background:var(--brand-2);border:1px solid #33535B;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-weight:600;font-size:14px}
.av{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;color:#fff}
.av.s{background:#2E8B6F}.av.k{background:#4D69A8}
.menu{position:absolute;right:0;top:calc(100% + 8px);width:290px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:10px;box-shadow:0 14px 40px rgba(0,0,0,.22);padding:6px;z-index:30}
.menu .mh{font-size:12.5px;color:var(--ink-3);padding:8px 10px 4px;font-weight:600}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 10px;cursor:pointer;font-size:14px}
.menu button:hover{background:var(--surface-2)}
.menu .sep{height:1px;background:var(--line);margin:6px 4px}
.menu .chk{margin-left:auto;color:var(--accent);font-weight:700}
.menu .danger{color:var(--crit)}

/* layout */
.wrap{max-width:1240px;margin:0 auto;padding:22px 24px 72px}
.hint{display:flex;gap:10px;align-items:flex-start;background:var(--info-soft);color:var(--ink);border-left:3px solid var(--info);padding:10px 14px;margin:0 0 20px;font-size:14px;border-radius:0}
.hint svg{flex:none;margin-top:2px;color:var(--info)}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.pad{padding:18px 20px}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.grid2.even{grid-template-columns:1fr 1fr}
@media (max-width:920px){.grid2,.grid2.even{grid-template-columns:1fr}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.right{margin-left:auto}

/* stepper */
.steps{display:flex;gap:6px;margin:0 0 18px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;background:none;border:1px solid var(--line);border-radius:999px;padding:5px 12px 5px 6px;font-size:13.5px;font-weight:600;color:var(--ink-2);cursor:pointer}
.step .n{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;background:var(--surface-2);color:var(--ink-2)}
.step.on{background:var(--surface);border-color:var(--ink);color:var(--ink)}
.step.on .n{background:var(--ink);color:var(--surface)}
.step.done .n{background:var(--accent);color:var(--accent-ink)}
.step:disabled{opacity:.45;cursor:not-allowed}

/* buttons, pills */
.btn{font-weight:600;font-size:14px;border-radius:6px;padding:9px 15px;border:1px solid transparent;cursor:pointer;display:inline-flex;align-items:center;gap:8px;line-height:1.2}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.sec{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.sec:hover:not(:disabled){border-color:var(--ink-3)}
.btn.lnk{background:none;border:0;padding:4px 2px;color:var(--info)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn:disabled{opacity:.42;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;padding:2px 10px;border-radius:999px;white-space:nowrap}
.ok{background:var(--accent-soft);color:var(--accent)}
.warn{background:var(--warn-soft);color:var(--warn)}
.crit{background:var(--crit-soft);color:var(--crit)}
.info{background:var(--info-soft);color:var(--info)}
.neu{background:var(--surface-2);color:var(--ink-2)}

/* tables */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-weight:600;color:var(--ink-3);font-size:12.5px;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--surface-2)}
.tbl tr.new td:first-child{box-shadow:inset 3px 0 0 var(--accent)}

/* forms */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink-3)}
.field .v,.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:9px 11px;font-size:14px;min-height:39px;color:var(--ink)}
.field .v.empty{color:var(--ink-3)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px}
select.inp{cursor:pointer;background:var(--surface)}
textarea.inp{width:100%;font:inherit;font-size:14px;resize:vertical;min-height:84px;background:var(--surface)}

/* checklist */
.cl-group{margin-bottom:16px}
.cl-group h3{color:var(--ink-2);font-size:13.5px;margin-bottom:8px}
details.ci{border:1px solid var(--line);border-radius:8px;margin-bottom:8px;background:var(--surface)}
details.ci summary{list-style:none;display:flex;gap:10px;align-items:center;padding:11px 14px;cursor:pointer;font-weight:500}
details.ci summary::-webkit-details-marker{display:none}
details.ci summary .caret{margin-left:auto;color:var(--ink-3);transition:transform .2s}
details.ci[open] summary .caret{transform:rotate(90deg)}
details.ci .body{padding:0 14px 12px 40px;font-size:14px;color:var(--ink-2)}
details.ci.key{border-color:var(--warn);background:var(--warn-soft)}
.box{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--ink-3);flex:none;display:grid;place-items:center}
.box.ok{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
.msg{white-space:pre-wrap;background:var(--surface-2);border:1px solid var(--line);border-radius:8px;padding:14px 16px;font-size:14px;line-height:1.65;max-height:420px;overflow:auto}
.seg-toggle{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg-toggle button{background:var(--surface);border:0;padding:6px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.seg-toggle button.on{background:var(--ink);color:var(--surface)}

/* upload */
.drop{border:1.5px dashed var(--ink-3);border-radius:10px;padding:26px;text-align:center;background:var(--surface)}
.drop svg{color:var(--ink-3)}
.prog{height:6px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);transition:width .4s ease}
.status{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2)}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--info);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.fname{font-weight:500}
.fsub{font-size:12.5px;color:var(--ink-3)}

/* wealth streams bar: the signature element */
.streams-wrap{padding:20px 22px 18px}
.streams-title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.streams-title .big{font-size:30px;font-weight:600;letter-spacing:-0.02em}
.streams{display:flex;height:46px;gap:3px;border-radius:8px;overflow:hidden}
.seg{display:flex;align-items:center;padding:0 12px;color:#fff;font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;transition:flex-grow .9s cubic-bezier(.3,.7,.2,1);min-width:0}
.seg.gap{background:repeating-linear-gradient(135deg,var(--crit-soft) 0 7px,var(--surface) 7px 14px);color:var(--crit);border:1.5px dashed var(--crit);border-radius:2px}
.legend{display:flex;gap:18px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:7px}
.legend i{width:10px;height:10px;border-radius:2px;display:inline-block}
@media (prefers-reduced-motion: reduce){.seg,.prog i{transition:none}.spin{animation:none}}

/* narrative */
.nar section{padding:14px 0;border-top:1px solid var(--line)}
.nar section:first-child{border-top:0;padding-top:0}
.nar h3{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.nar h3 .amt{font-weight:500;color:var(--ink-3);font-size:13.5px}
.nar p{max-width:72ch;margin:0}
.cite{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:1px 8px 1px 6px;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);color:var(--info);cursor:pointer;vertical-align:1px;line-height:1.5;white-space:nowrap}
.cite:hover{border-color:var(--info)}
.gapline{background:var(--crit-soft);color:var(--crit);padding:1px 5px;border-radius:3px;font-weight:600}
.newline{background:var(--accent-soft);color:var(--ink);padding:1px 3px;border-radius:3px}

/* issues */
.issue{border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:10px;background:var(--surface)}
.issue.c{border-left:4px solid var(--crit)}
.issue.w{border-left:4px solid var(--warn)}
.issue.n{border-left:4px solid var(--info)}
.issue.done{border-left-color:var(--accent);opacity:.92}
.issue h3{margin:6px 0 4px}
.issue p{font-size:14px;color:var(--ink-2)}

/* verification tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);padding:0 12px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:12px 10px 10px;font-weight:600;font-size:14px;color:var(--ink-3);cursor:pointer;display:flex;gap:7px;align-items:center;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
.tag-sim{font-size:12px;color:var(--ink-3);border:1px dashed var(--line);border-radius:999px;padding:1px 9px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:6px 16px;font-size:14px}
.kv dt{color:var(--ink-3)}
.kv dd{margin:0}
.ai{display:flex;gap:10px;background:var(--surface-2);border-radius:8px;padding:12px 14px;font-size:14px}
.ai svg{flex:none;color:var(--accent);margin-top:2px}
.ctx li{margin-bottom:8px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(8,18,22,.48);z-index:40}
.viewer{position:fixed;top:0;right:0;bottom:0;width:min(1120px,97vw);background:var(--surface);z-index:50;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.vhead{padding:16px 20px 12px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:flex-start}
.vhead .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.x{background:none;border:1px solid var(--line);border-radius:6px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;flex:none;color:var(--ink)}
.vbody{flex:1;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);min-height:0}
.vleft{background:var(--surface-2);overflow:auto;padding:8px 16px 30px}
.vright{display:flex;flex-direction:column;min-height:0;border-left:1px solid var(--line)}
.vright .vpane{overflow:auto;padding:16px 20px 30px;flex:1}
.vfoot{border-top:1px solid var(--line);padding:12px 20px;display:flex;gap:10px;align-items:center}
@media (max-width:860px){.vbody{grid-template-columns:1fr;overflow:auto}.vleft,.vright .vpane{overflow:visible}}
.cap{font-size:12.5px;color:var(--ink-3);margin:10px auto 0;max-width:660px;display:flex;justify-content:space-between}
.paper{background:var(--paper);color:var(--paper-ink);max-width:660px;margin:8px auto 0;padding:38px 42px;box-shadow:0 1px 3px rgba(0,0,0,.14),0 8px 24px rgba(0,0,0,.06);position:relative;overflow:hidden;font-family:"Noto Serif SC","Songti SC","SimSun",serif;font-size:13.5px;line-height:1.75}
.paper::after{content:"SAMPLE";position:absolute;top:42%;left:50%;transform:translate(-50%,-50%) rotate(-24deg);font:700 104px/1 "Instrument Sans",sans-serif;color:rgba(168,50,63,.08);pointer-events:none;letter-spacing:.06em}
.paper.photo{transform:rotate(-1.1deg);background:#EFEBE2;filter:contrast(.93) saturate(.9);margin-top:16px}
.paper.en{font-family:"Instrument Sans",sans-serif}
.doc h2.d1{font-size:19px;text-align:center;margin:4px 0 14px;font-weight:600}
.doc h3.d2{font-size:15.5px;margin:14px 0 6px;font-weight:600}
.doc h4.d3{font-size:14px;margin:14px 0 4px;font-weight:600}
.doc p{margin:0 0 9px}
.doc table{border-collapse:collapse;width:100%;margin:6px 0 12px;font-size:12.5px}
.doc th,.doc td{border:1px solid rgba(0,0,0,.18);padding:5px 7px;text-align:left;vertical-align:top}
.doc th{background:rgba(0,0,0,.04);font-weight:600}
.vpane .doc th,.vpane .doc td{border-color:var(--line)}
.vpane .doc th{background:var(--surface-2)}
.vpane .doc{font-size:14px}
.pgbrk{text-align:center;font-size:11.5px;color:#8A8A8A;border-top:1px dashed #BBB;margin:18px 0 12px;padding-top:6px;font-family:"Instrument Sans",sans-serif}
.ill{background:#6E6E6E;color:transparent;border-radius:2px;filter:blur(1.4px)}
mark.hl{background:rgba(255,227,138,.38);color:inherit;border-radius:3px;padding:0 2px;transition:background .3s,box-shadow .3s}
mark.hl.on{background:var(--hl);box-shadow:0 0 0 3px var(--hl)}
.facts td{font-size:13.5px}
.facts tr.has{cursor:pointer}
.facts tr.has:hover td{background:var(--surface-2)}
.facts tr.on td{background:var(--warn-soft)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:min(460px,100vw);background:var(--surface);z-index:50;display:flex;flex-direction:column;box-shadow:-14px 0 44px rgba(0,0,0,.25);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dpane{flex:1;overflow:auto;padding:16px 20px}
.msgb{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.msgb .who2{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;margin-bottom:6px}
.msgb.aib{background:var(--surface-2)}
.typing{display:inline-flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);animation:bl 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.audit li{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.audit .t{color:var(--ink-3)}
.audit .a{font-weight:600}

.modal{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:20px}
.modal .card{background:var(--surface);border-radius:14px;max-width:560px;width:100%;padding:28px 30px;box-shadow:0 30px 80px rgba(0,0,0,.35);position:relative}
.modal .card h2{font-size:22px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:11px 18px;border-radius:8px;font-size:14px;font-weight:500;z-index:70;box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw}
.banner{display:flex;gap:12px;align-items:center;flex-wrap:wrap;border:1px solid var(--accent);background:var(--accent-soft);border-radius:10px;padding:12px 16px;margin-bottom:18px;font-size:14px}
.empty{padding:28px;text-align:center;color:var(--ink-3)}
.letter h3.sec{font-size:14px;color:var(--ink-2);margin:22px 0 8px;padding-top:14px;border-top:1px solid var(--line)}
.kvt td{padding:8px 10px;font-size:13.5px}
.letter .nar section{padding:10px 0}
.letter details.ci .body{color:var(--ink)}
</style>

# Share Transfer Agreement

Agreement No.: LR-ZJ-2021-001 (sample)
Date of signing: 15 March 2021
Place of signing: Shenzhen, Guangdong Province

**Transferor (Party A):** Lin Zhaoyu
ID number: 4403**********1234
Address: Futian District, Shenzhen [address redacted]

**Transferee (Party B):** Zhujiang Vista Equity Investment Partnership (LP)
Unified social credit code: 91440101SAMPLE5678
Executive partner: Zhujiang Vista Capital Management Co., Ltd. (appointed representative: He Zhicheng)

**Target company:** Shenzhen Lingrui Precision Components Co., Ltd.
Unified social credit code: 914403007SAMPLE123

Whereas: the Target Company was established on 18 August 2003 with registered capital of RMB 50,000,000, and Party A holds 100% of its equity. After friendly negotiation, the parties agree as follows:

### Article 1 Subject of the transfer

1.1 Party A agrees to transfer to Party B 60% of the equity of the Target Company (corresponding to RMB 30,000,000 of registered capital), and Party B agrees to acquire it.

1.2 After completion of the transfer, the shareholding of the Target Company is as follows:

| Shareholder | Subscribed capital (RMB) | Shareholding |
|---|---|---|
| Zhujiang Vista Equity Investment Partnership (LP) | 30,000,000 | 60% |
| Lin Zhaoyu | 20,000,000 | 40% |
| Total | 50,000,000 | 100% |

### Article 2 Consideration

2.1 The total consideration for the share transfer is RMB 260,000,000 (in words: two hundred and sixty million yuan).

2.2 The consideration is payable in two tranches in accordance with Articles 3 and 4.

--- Page 2 ---

### Article 3 Payment schedule

3.1 **First tranche:** RMB 180,000,000 (in words: one hundred and eighty million yuan). Party B shall pay within 30 days after the change registration of this share transfer is completed with the company registration authority.

3.2 **Second tranche (earn-out payment):** RMB 80,000,000 (in words: eighty million yuan). This tranche is conditional on the condition in Article 4, and Party B shall pay it by 30 June 2023.

3.3 **Receiving account:** Lin Zhaoyu; Huachuan Commercial Bank, Shenzhen Futian Branch; account 6228 **** **** 3317

3.4 When making payment, Party B shall state “share transfer payment” and the tranche number in the payment reference.

### Article 4 Earn-out condition

4.1 The second tranche is payable on condition that the Target Company’s audited net profit for the 2022 financial year is not less than RMB 45,000,000 (in words: forty five million yuan).

4.2 Net profit shall be as stated in the 2022 audit report issued by an accounting firm jointly approved by the parties no later than 30 April 2023.

4.3 If audited 2022 net profit is below RMB 45,000,000, Party B is not required to pay the second tranche and Party A shall not claim any compensation in respect of it.

4.4 If the condition is satisfied, Party B shall pay the second tranche after the audit report is issued and no later than 30 June 2023.

### Article 5 Governing law and dispute resolution

5.1 This Agreement is governed by the laws of the People’s Republic of China.

5.2 Disputes shall be resolved through friendly negotiation; failing that, either party may bring proceedings before the competent People’s Court at the Target Company’s domicile.

**榕城今日讯（虚构媒体）　2019年11月14日**

# 福州一房产中介涉非法集资案宣判　经纪人被处罚金

本报讯（记者 郑雅琳）11月13日，福州市岚江区人民法院对一起非法吸收公众存款案作出一审判决。

被告人林兆宇，男，38岁，福州人，案发前系福州岚舍房产经纪有限公司房产经纪人。经查，2017年至2018年间，林兆宇伙同该公司其他人员，以“购房投资、高额返利”为名，向社会不特定人员吸收资金约人民币860万元。

法院认定其行为构成非法吸收公众存款罪，判处罚金人民币5万元，并责令退赔集资参与人损失。福州岚舍房产经纪有限公司已于2019年初停业。

法官提醒市民，对承诺高额回报的房产投资项目应提高警惕，谨防上当受骗。
`,
trans:`
**Rongcheng Today (fictional outlet)　14 November 2019**

# Fuzhou property agency fundraising case sentenced: agent fined

Staff report (reporter Zheng Yalin): On 13 November, the Lanjiang District People’s Court in Fuzhou delivered a first instance judgment in a case of illegally taking deposits from the public.

The defendant, Lin Zhaoyu, male, 38, from Fuzhou, was a real estate agent at Fuzhou Lanshe Real Estate Brokerage Co., Ltd. Between 2017 and 2018, Lin Zhaoyu and other staff raised about RMB 8.6 million from members of the public, promising “property investment with high returns”.

  else if(!st.mediaCleared)h='Review the adverse media match and confirm whether it is your client.';

  else if(!st.answered)h='Open Questions and ask why the sale was paid in two tranches, then record your decision.';
  else h='Record your decision at the bottom of the letter.';
  const hdr=st.partF?pill('Part F confirmed','ok'):st.mediaCleared?pill('Part F ready to confirm','info'):pill('Part F: 9 of 10 pre-assessed, 1 needs your review','warn');
  return `${hint(h)}
  <div class="pagehead"><div><h1>Lin Zhaoyu</h1>
    <div class="row small muted" style="gap:14px"><span>SW-2026-0142</span><span>Submitted by Sarah (RM), certified 22 Oct 2026</span><span>Risk rating ${pill('Medium','warn')}</span><span>${hdr}</span></div></div>
    <button class="btn sec" data-act="drawer">${I.chat} Questions</button></div>
  <div class="grid2">
    <div>
      <div style="margin-bottom:16px">${streams(false)}</div>
      <div class="panel pad" style="margin-bottom:16px">${letter(false,null)}</div>
      <div class="panel pad">${st.decision?`<h2>Decision</h2><p>${pill(st.decision==='approve'?'Approved':st.decision==='return'?'Returned to RM':'Escalated to Legal & Compliance Counsel','ok')}</p><p class="small muted" style="margin:0">${esc(st.rationale)}</p>`
      :`<h2>Your decision</h2>
        <div class="row" style="margin-bottom:12px">${[['approve','Approve'],['return','Return to RM'],['escalate','Escalate to Legal & Compliance Counsel']].map(o=>`<label class="row" style="gap:6px;cursor:pointer;margin-right:12px;flex-wrap:nowrap"><input type="radio" name="dec" value="${o[0]}" data-chg="dec" ${st.decChoice===o[0]?'checked':''}> ${o[1]}</label>`).join('')}</div>
        <label class="small muted" for="rat">Rationale</label><textarea id="rat" class="inp" data-inp="rationale">${esc(st.rationale)}</textarea>
        <div class="row" style="margin-top:10px"><button class="btn pri" data-act="decide" ${st.partF?'':'disabled'}>Sign and record decision</button>${st.partF?'':'<span class="small muted">Confirm Part F first.</span>'}</div>`}</div>
    </div>
    <div class="panel" style="position:sticky;top:calc(70px + env(safe-area-inset-top,0px))">
      <div class="tabs" role="tablist">${tabs.map(t=>`<button class="tab ${st.ccTab===t[0]?'on':''}" role="tab" data-act="ccTab" data-t="${t[0]}">${t[1]}${t[0]==='media'&&!st.mediaCleared?pill('Review','warn'):''}</button>`).join('')}</div>
      <div class="pad">${vtab()}</div>
    </div>
  </div>`;
}

/* ---------- overlays ---------- */
function viewer(){
  const v=st.viewer;if(!v)return'';const D=DOCS[v.doc];
  const mark=h=>v.k?h.replace(new RegExp('class="hl" data-k="'+v.k+'"'),'class="hl on" data-k="'+v.k+'"'):h;
  const transHtml=applyHL(md(D.trans),D.hl,1);
  const ci=CL_LIN.find(c=>c.docs&&c.docs.includes(v.doc));
  const low=D.facts.filter(f=>f[4]==='Low').length;
  let pane='';
  if(v.tab==='summary')pane=`<h3>What this document proves</h3><p>${esc(D.summary)}</p>${low?`<div class="issue w" style="margin-top:14px"><div class="row">${pill(low+' fields read with low confidence','warn')}</div><p style="margin:6px 0 0">Blurry photo. A person should confirm these values or request a clearer copy.</p></div>`:''}<p class="small muted" style="margin-top:16px">AI translation. Refer to the original for exact wording.</p>`;
  else if(v.tab==='facts')pane=`<p class="small muted">Click a fact to see where it came from.</p><div class="tw"><table class="tbl facts"><thead><tr><th>Field</th><th>Value</th><th>Page</th><th>Confidence</th></tr></thead><tbody>${D.facts.map(f=>`<tr class="${f[5]?'has':''} ${f[5]&&f[5]===v.k?'on':''}" ${f[5]?`data-act="hl" data-k="${f[5]}"`:''}><td class="muted">${esc(f[0])}</td><td>${esc(f[1])}${f[2]?`<div class="fsub">${esc(f[2])}</div>`:''}</td><td>${f[3]}</td><td>${conf(f[4])}</td></tr>`).join('')}</tbody></table></div>`;
  else pane=`<p class="small muted">${D.en?'The original is in English, so the text is shown unchanged.':'AI translation. Refer to the original for exact wording.'}</p><div class="doc">${mark(transHtml)}</div>`;
  const cc=st.role==='cc';
  return `<div class="scrim" data-act="closeViewer"></div>
  <aside class="viewer" role="dialog" aria-label="Document viewer">
    <div class="vhead"><div style="flex:1;min-width:0"><h2 style="margin:0">${esc(D.type)}</h2><div class="small muted">${esc(D.file)}</div>
      <div class="meta">${pill(D.lang,'neu')}${pill(D.src,'info')}${pill(D.pages+(D.pages>1?' pages':' page'),'neu')}${ci&&v.doc!=='DOC-09'?pill('Checklist: '+ci.item,'ok'):''}${D.photo?pill('Phone photo, partly illegible','warn'):''}${cc&&st.verified[v.doc]?pill('Verified by Kevin','ok'):''}</div></div>
      <button class="x" data-act="closeViewer" aria-label="Close">${I.x}</button></div>
    <div class="vbody">
      <div class="vleft"><div class="cap"><span>Original as received</span><span>${D.lang}</span></div><div class="paper doc ${D.photo?'photo':''} ${D.en?'en':''}">${mark(applyHL(md(D.orig),D.hl,0))}</div></div>
      <div class="vright">
        <div class="tabs" role="tablist">${[['summary','Summary'],['facts','Key facts'],['trans','Full translation']].map(t=>`<button class="tab ${v.tab===t[0]?'on':''}" data-act="vtab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
        <div class="vpane">${pane}</div>
        ${cc&&v.doc!=='DOC-09'?`<div class="vfoot"><button class="btn ${st.verified[v.doc]?'sec':'pri'} sm" data-act="verify">${st.verified[v.doc]?'Verified':'Mark as verified'}</button><span class="small muted">Recorded in the audit trail</span></div>`:''}
      </div>
    </div>
  </aside>`;
}

const AI_ANSWER=()=>`The second payment of RMB 80M was an earn-out. Under Article 4 of the agreement, it was payable only if the company’s audited 2022 net profit reached at least RMB 45M, and was due by 30 June 2023 ${cite('DOC-01',2,'cond')}. It was received on 12 June 2023 with a payment reference to Article 4 ${cite('DOC-04',1,'pay')}, and tax of RMB 16M was paid on it on 21 June 2023 ${cite('DOC-05',1,'t2tax')}.`;
const AI_PLAIN='The second payment of RMB 80M was an earn-out, payable only if the company’s audited 2022 net profit reached at least RMB 45M (Article 4 of the agreement). It was received on 12 June 2023 and tax was paid on it on 21 June 2023.';

function auditList(){
  const E=[];const a=(t,w,e,c)=>{if(c)E.push([t,w,e])};
  a('21 Oct, 10:02','Sarah (RM)','Client profile created',st.profile||st.generated);
  a('21 Oct, 10:03','SourceWise AI',`Checklist generated (${NCL} items)`,st.generated);
  a('21 Oct, 10:05','Sarah (RM)','Checklist sent to client',st.checklistSent);
  a('22 Oct, 09:14','Sarah (RM)','7 documents uploaded',st.uploaded.length>0);
  a('22 Oct, 09:15','SourceWise AI','Documents classified; Certification Letter pre-filled',st.uploaded.length>0);
  a('22 Oct, 09:15','SourceWise AI','Readiness check: 1 critical, 2 checks',st.uploaded.length>0);
  a('22 Oct, 09:18','Sarah (RM)','Follow-up sent to client',st.fu==='sent');
  a('22 Oct, 11:40','Sarah (RM)','June 2023 statement uploaded; gap closed',st.doc04);
  a('22 Oct, 11:42','Sarah (RM)','Seed capital explanation added',st.seed);
  a('22 Oct, 11:44','Sarah (RM)','Property item accepted with reason',st.ackProp);
  a('22 Oct, 11:46','Sarah (RM)','Certification signed; letter submitted to compliance',st.submitted);
  a('22 Oct, 11:46','SourceWise AI','Part F pre-assessed: 9 items, 1 for review',st.submitted);
  a('22 Oct, 14:05','Kevin (Compliance)','Adverse media match confirmed as different person',st.mediaCleared);
  Object.keys(st.verified).forEach(d=>{if(st.verified[d])E.push(['22 Oct, 14:06','Kevin (Compliance)',DOCS[d].short+' marked as verified'])});
  a('22 Oct, 14:07','Kevin (Compliance)','Part F confirmed',st.partF);
  a('22 Oct, 14:08','SourceWise AI','Answered question on payment tranches',st.answered);
  a('22 Oct, 14:09','Kevin (Compliance)','Question marked resolved',st.resolved);
  a('22 Oct, 14:09','Kevin (Compliance)','Question sent to Sarah (RM)',st.forwarded);
  a('22 Oct, 14:30','Sarah (RM)','Replied to compliance question',st.rmReplied);
  a('22 Oct, 14:12','Kevin (Compliance)',st.decision==='approve'?'Case approved and signed':st.decision==='return'?'Case returned to RM':'Case escalated',!!st.decision);
  return E.length?`<ul class="audit" style="list-style:none;padding:0;margin:0">${E.map(e=>`<li><span class="t">${e[0]}</span><span><span class="a">${e[1]}</span><br>${e[2]}</span></li>`).join('')}</ul>`:'<div class="empty">Nothing recorded yet.</div>';
}

function drawer(){
  if(!st.drawer)return'';
  const cc=st.role==='cc';
  let thread='';
  if(cc){
    if(!st.asked)thread=`<p class="small muted">Ask about anything in the case. SourceWise answers from the case file first, and you decide whether Sarah needs to be involved.</p>
      <button class="btn sec" style="width:100%;justify-content:flex-start;text-align:left;margin:6px 0 10px" data-act="ask">${I.chat} Why was the sale paid in two tranches?</button>
      <input class="inp" style="width:100%" disabled placeholder="Free questions are not available in this demo">`;
    else{
      thread=`<div class="msgb"><div class="who2"><span class="av k" style="width:22px;height:22px;font-size:11px">K</span>Kevin (Compliance)</div>Why was the sale paid in two tranches?</div>`;
      if(st.thinking)thread+=`<div class="msgb aib"><div class="who2">${I.spark} SourceWise AI</div><span class="typing"><i></i><i></i><i></i></span></div>`;
      else{
        thread+=`<div class="msgb aib"><div class="who2">${I.spark} SourceWise AI</div>${AI_ANSWER()}</div>`;
        if(st.resolved)thread+=`<p>${pill('Resolved by Kevin (Compliance). Not sent to RM.','ok')}</p>`;
        else if(st.forwarded)thread+=`<p>${pill('Sent to Sarah (RM)','info')}</p>`+(st.rmReplied?`<div class="msgb"><div class="who2"><span class="av s" style="width:22px;height:22px;font-size:11px">S</span>Sarah (RM)</div>${esc(AI_PLAIN)}</div>`:'');
        else thread+=`<div class="row"><button class="btn pri sm" data-act="resolveQ">Mark resolved</button><button class="btn sec sm" data-act="forwardQ">Send to RM</button></div>`;
      }
    }
  }else{
    if(!st.forwarded)thread=`<div class="empty">No questions from compliance on this case. Questions that SourceWise answers from the file never reach you.</div>`;
    else thread=`<div class="msgb"><div class="who2"><span class="av k" style="width:22px;height:22px;font-size:11px">K</span>Kevin (Compliance)</div>Why was the sale paid in two tranches?</div>`+
      (st.rmReplied?`<div class="msgb"><div class="who2"><span class="av s" style="width:22px;height:22px;font-size:11px">S</span>Sarah (RM)</div>${esc(AI_PLAIN)}</div>`:
      `<label class="small muted">Your reply (suggested by SourceWise)</label><textarea class="inp" disabled>${esc(AI_PLAIN)}</textarea><button class="btn pri sm" style="margin-top:8px" data-act="rmReply">Send reply</button>`);
  }
  return `<div class="scrim" data-act="closeDrawer"></div>
  <aside class="drawer" role="dialog" aria-label="Questions">
    <div class="vhead"><div style="flex:1"><h2 style="margin:0">Questions</h2><div class="small muted">Lin Zhaoyu, SW-2026-0142</div></div><button class="x" data-act="closeDrawer" aria-label="Close">${I.x}</button></div>
    <div class="tabs">${[['thread','Case thread'],['audit','Audit trail']].map(t=>`<button class="tab ${st.drawerTab===t[0]?'on':''}" data-act="dtab" data-t="${t[0]}">${t[1]}</button>`).join('')}</div>
    <div class="dpane">${st.drawerTab==='thread'?thread:auditList()}</div>
  </aside>`;
}

function modal(){
  if(st.modal==='welcome')return `<div class="scrim"></div><div class="modal" role="dialog" aria-label="Welcome"><div class="card">
    <div class="logo" style="color:var(--ink);margin-bottom:14px"><span style="background:var(--brand);border-radius:8px;padding:6px;display:flex">${LOGO}</span><span>SourceWise</span></div>
    <p style="margin:-6px 0 16px;font-size:14px;font-weight:600;color:var(--ink-2)">Prototype by the 2026 NUS MBA team</p>
    <h2>Source of wealth checks, without the back-and-forth</h2>
    <p>Sarah, a relationship manager, is onboarding Mr. Lin Zhaoyu, a first generation entrepreneur from Shenzhen. SourceWise helps her request the right documents and pre-fills the RM Certification Letter, catching gaps before submission. Kevin from compliance then completes his Part F review.</p>
    <p>Use the account menu at the top right to switch between <strong>Sarah (RM)</strong> and <strong>Kevin (Compliance)</strong>, jump to a scene, or reset. The blue strip on each screen tells you what to try next.</p>
    <p class="small muted">All people, companies and documents are fictional. AI outputs are scripted for this demo.</p>
    <button class="btn pri" data-act="closeModal" style="margin-top:6px">Start as Sarah (RM)</button></div></div>`;
  if(st.modal==='reset')return `<div class="scrim" data-act="closeModal"></div><div class="modal" role="dialog" aria-label="Reset demo"><div class="card">
    <h2>Reset the demo?</h2><p>This restores everything to the starting state and switches back to Sarah (RM).</p>
    <div class="row"><button class="btn pri" data-act="reset">Reset demo</button><button class="btn sec" data-act="closeModal">Cancel</button></div></div></div>`;
  if(st.modal==='certify')return `<div class="scrim" data-act="closeModal"></div><div class="modal" role="dialog" aria-label="Certify and submit"><div class="card" style="max-width:620px">
    <h2>Certify and submit</h2><p class="small muted">As in Parts B and E of the Certification Letter, you confirm the following for Lin Zhaoyu.</p>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:12px 0 16px">${CERTS.map((c,i)=>`<div class="row small" style="flex-wrap:nowrap;gap:8px"><span class="box ok">${I.check}</span>${i+1}. ${c}</div>`).join('')}</div>
    <label class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px;cursor:pointer;background:var(--surface-2);padding:12px;border-radius:8px"><input type="checkbox" data-chg="cert" ${st.certChecked?'checked':''} style="margin-top:3px"><span>I confirm the information in this certification is true, complete and accurate to the best of my knowledge, and was prepared under the Company’s policies and applicable MAS regulations.</span></label>
    <div class="fgrid" style="margin:14px 0"><div class="field"><label>Full name</label><div class="v">Sarah Tan</div></div><div class="field"><label>Date</label><div class="v">22 Oct 2026</div></div></div>
    <div class="row"><button class="btn pri" data-act="certSubmit" ${st.certChecked?'':'disabled'}>Sign and submit</button><button class="btn sec" data-act="closeModal">Cancel</button></div></div></div>`;
  return'';
}

/* ---------- render ---------- */
const app=document.getElementById('app'),overlay=document.getElementById('overlay');
function render(){
  let main;
  if(st.role==='rm'){const v=st.rmView;main=v==='home'?rmHome():v==='profile'?rmProfile():v==='checklist'?rmChecklist():v==='upload'?rmUpload():rmReport();}
  else main=st.ccView==='review'?ccReview():ccQueue();
  app.innerHTML=topbar()+`<main class="wrap">${main}</main>`;
  overlay.innerHTML=viewer()+drawer()+modal()+(st.toast?`<div class="toast" role="status">${esc(st.toast)}</div>`:'');
  document.body.style.overflow=(st.viewer||st.drawer||st.modal)?'hidden':'';
  if(st.viewer&&st.viewer.k&&st.viewer.scroll){
    st.viewer.scroll=false;
    requestAnimationFrame(()=>{document.querySelectorAll('.viewer mark.hl.on').forEach(m=>m.scrollIntoView({block:'center',behavior:'smooth'}))});
  }
}

/* ---------- actions ---------- */
function go(v){if(st.role==='rm')st.rmView=v;else st.ccView=v;window.scrollTo(0,0);render()}
function startUpload(){
  st.uploading=true;st.tick=0;render();
  const step=()=>{st.tick++;render();if(st.tick<BATCH1.length+4){later(step,330)}else{st.uploading=false;st.uploaded=[...BATCH1];render();toast('7 documents read and mapped to the checklist')}};
  later(step,330);
}
function jump(a){
  clearTimers();st=fresh();
  if(a>=2){st.profile='lin';st.generated=true;st.checklistSent=true;st.rmView='upload'}
  if(a>=3){st.uploaded=[...BATCH1,'DOC-04'];st.doc04=true;st.fu='sent';st.seed=true;st.ackProp=true;st.certChecked=true;st.submitted=true;st.rmView='report';st.role='cc';st.ccView='queue'}
  window.scrollTo(0,0);render();toast(a===1?'Jumped to Act 1':a===2?'Jumped to Act 2: Mr. Lin’s documents are ready to upload':'Jumped to Act 3: the case is in Kevin’s queue');
}
const ACT={
  menu(){st.menu=!st.menu;render()},
  role(e){st.role=e.dataset.r;st.menu=false;st.drawer=null;st.viewer=null;if(st.role==='cc'&&st.submitted&&!st.ccOpened)st.ccView='queue';window.scrollTo(0,0);render()},
  jump(e){jump(+e.dataset.a)},
  about(){st.menu=false;st.modal='welcome';render()},
  askReset(){st.menu=false;st.modal='reset';render()},
  reset(){clearTimers();st=fresh();window.scrollTo(0,0);render();toast('Demo reset')},
  closeModal(){st.modal=null;render()},
  go(e){go(e.dataset.v)},
  openLin(){go(rmLinView())},
  bell(){if(st.forwarded&&!st.rmReplied){st.rmView='report';st.drawer=true;st.drawerTab='thread';render()}else toast('No new notifications')},
  generate(){st.generated=true;st.clProfile=st.profile||'lin';go('checklist')},
  clp(e){st.clProfile=e.dataset.p;render()},
  msgLang(e){st.msgLang=e.dataset.l;render()},
  copy(e){const t=e.dataset.t==='msg'?(st.msgLang==='en'?MSG_EN:MSG_ZH):(st.fuLang==='en'?FU_EN:FU_ZH);try{navigator.clipboard.writeText(t)}catch(_){}toast('Message copied')},
  exportPdf(){toast('PDF exported (demo only)')},
  exportLetter(){toast('Certification Letter exported (demo only)')},
  markSent(){st.checklistSent=true;toast('Checklist sent to Mr. Lin');go('upload')},
  upload(){startUpload()},
  openDoc(e){st.viewer={doc:e.dataset.doc,k:e.dataset.k||null,tab:e.dataset.k?'facts':'summary',scroll:true};render()},
  closeViewer(){st.viewer=null;render()},
  vtab(e){st.viewer.tab=e.dataset.t;st.viewer.scroll=!!st.viewer.k;render()},
  hl(e){st.viewer.k=e.dataset.k;st.viewer.scroll=true;render()},
  verify(){const d=st.viewer.doc;st.verified[d]=!st.verified[d];render()},
  draftFu(){st.fu='drafted';render()},
  fuLang(e){st.fuLang=e.dataset.l;render()},
  fuSent(){st.fu='sent';toast('Follow-up sent to Mr. Lin');render()},
  uploadFu(){st.fuUploading=true;render();later(()=>{st.fuUploading=false;st.doc04=true;st.uploaded=[...st.uploaded,'DOC-04'];render();toast('June 2023 statement read. Gap closed.')},1600)},
  seedOpen(){st.seedOpen=true;render()},
  seedCancel(){st.seedOpen=false;render()},
  seedSave(){st.seed=true;st.seedOpen=false;render();toast('Seed capital explanation added to the letter')},
  ackPropOpen(){st.ackPropOpen=true;render()},
  ackPropCancel(){st.ackPropOpen=false;render()},
  ackProp(){st.ackProp=true;st.ackPropOpen=false;render()},
  submit(){st.modal='certify';render()},
  certSubmit(){st.modal=null;st.submitted=true;window.scrollTo(0,0);render();toast('Certified and submitted to compliance')},
  openReview(){st.ccOpened=true;go('review')},
  ccTab(e){st.ccTab=e.dataset.t;render()},
  clearMedia(){st.mediaCleared=true;st.ccTab='partf';toast('Match cleared. Part F updated.');render()},
  confirmF(){st.partF=true;render();toast('Part F confirmed')},
  decide(){st.decision=st.decChoice;window.scrollTo(0,0);render();toast(st.decision==='approve'?'Case approved':st.decision==='return'?'Case returned to Sarah':'Case escalated')},
  drawer(){st.drawer=true;render()},
  closeDrawer(){st.drawer=null;render()},
  dtab(e){st.drawerTab=e.dataset.t;render()},
  ask(){st.asked=true;st.thinking=true;render();later(()=>{st.thinking=false;st.answered=true;render()},1400)},
  resolveQ(){st.resolved=true;render();toast('Question resolved without involving Sarah')},
  forwardQ(){st.forwarded=true;render();toast('Question sent to Sarah (RM)')},
  rmReply(){st.rmReplied=true;render();toast('Reply sent to Kevin')}
};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]');
  if(st.menu&&!e.target.closest('.who')){st.menu=false;if(!t){render();return}}
  if(!t)return;const a=t.dataset.act;if(ACT[a]){e.preventDefault();ACT[a](t)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){if(st.menu)st.menu=false;else if(st.viewer)st.viewer=null;else if(st.drawer)st.drawer=null;else if(st.modal&&st.modal!=='welcome')st.modal=null;render()}
  if((e.key==='Enter'||e.key===' ')&&e.target.matches('tr[data-act]')){e.preventDefault();const a=e.target.dataset.act;ACT[a]&&ACT[a](e.target)}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.inp;if(k)st[k]=e.target.value});
document.addEventListener('change',e=>{
  const c=e.target.dataset&&e.target.dataset.chg;
  if(c==='loadProfile'){st.profile=e.target.value||null;render()}
  if(c==='dec'){st.decChoice=e.target.value}
  if(c==='cert'){st.certChecked=e.target.checked;render()}
});
st.modal='welcome';
render();
</script>
